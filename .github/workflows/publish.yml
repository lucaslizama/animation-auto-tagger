name: Publish to itch.io

# Pushing a v* tag builds the extension and sends it to itch with butler.
#
# Two things have to be set up in the repository settings before this can work:
#
#   Secrets > BUTLER_API_KEY    from itch.io/user/settings/api-keys
#   Variables > ITCH_TARGET     user/game:channel, all three parts, for example
#                               lucaslizama/animation-auto-tagger:win-linux-mac
#
# The channel half decides the platform tags: butler reads win, linux, mac and
# android out of the channel name, and one channel may carry several. The
# package is one file that installs on all three, so the channel says so.
#
# Both are checked before butler runs, so a missing one fails with a sentence
# rather than an authentication error from somewhere inside butler.
#
# It can also be run by hand from the Actions tab, which builds and tests but
# publishes nothing: only a tag push does that.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to itch as well as building (for testing the pipeline)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The suites that run against the stand-in API need only an interpreter.
      # The end-to-end pair needs a real Aseprite, which cannot be installed
      # here, and the runner skips them by itself when it finds none.
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run the suites
        run: scripts/run-tests.sh

      # The same check scripts/release.sh makes locally. A package whose
      # version disagrees with the tag it went out under is the one thing
      # nobody thinks to doubt afterwards.
      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
          echo "publishing $version"

      - name: Build the extension
        run: scripts/build.sh

      # butler takes a directory: "Directory to upload. May also be a zip
      # archive". A single loose file is not one of those, and pushing one was
      # accepted, reported as processing, and then silently amounted to no
      # channel at all. So the file goes in a directory of its own.
      - name: Stage the upload
        run: |
          rm -rf dist/upload
          mkdir -p dist/upload
          cp dist/animation-auto-tagger.aseprite-extension dist/upload/
          ls -l dist/upload

      # Kept whether or not the push happens, so a failed publish still leaves
      # the exact file behind to look at.
      - name: Keep the package with the run
        uses: actions/upload-artifact@v7
        with:
          name: animation-auto-tagger
          path: dist/animation-auto-tagger.aseprite-extension
          if-no-files-found: error

      # From itch's own download service rather than a third-party action, so
      # nothing between here and them can substitute the binary.
      - name: Fetch butler
        run: |
          curl -sSL -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V

      - name: Push to itch.io
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set: add it under Settings > Secrets and variables > Actions" >&2
            exit 1
          fi
          if [ -z "$ITCH_TARGET" ]; then
            echo "ITCH_TARGET is not set: add it as a repository variable, as user/game:channel" >&2
            exit 1
          fi
          case "$ITCH_TARGET" in
            */*:*) ;;
            *) echo "ITCH_TARGET should look like user/game:channel, got $ITCH_TARGET" >&2; exit 1 ;;
          esac

          version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"

          # Verbose, so the build id can be picked out of it, but written to a
          # file rather than the log: the verbose output carries signed upload
          # URLs for this build's files, which have no business in a public log.
          if ! butler/butler -v push dist/upload "$ITCH_TARGET" \
                 --userversion "$version" > push.log 2>&1; then
            grep -E '^(•|✗|Error)' push.log || tail -5 push.log
            exit 1
          fi
          grep -E '^(•|✓)' push.log || true

          grep -oE 'build/[0-9]+/' push.log | head -1 | tr -dc '0-9' > build-id.txt
          echo "build id: $(cat build-id.txt)"

      # butler says "should be up in a bit" the moment the upload finishes,
      # which is not the same as itch having processed it. Until a build
      # completes there is no channel and nothing to download, so a release
      # that stopped at the upload looks published when it is not.
      - name: Confirm itch processed the build
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          id="$(cat build-id.txt)"
          if [ -z "$id" ]; then
            echo "::warning::could not tell which build was created, so it was not checked"
            exit 0
          fi

          for attempt in $(seq 1 18); do
            state="$(curl -sS -H "Authorization: $BUTLER_API_KEY" \
                      "https://api.itch.io/wharf/builds/$id" \
                     | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"]["state"])')"
            echo "build $id: $state"
            case "$state" in
              completed) echo "the upload is live"; exit 0 ;;
              failed)    echo "::error::itch failed to process build $id"; exit 1 ;;
            esac
            sleep 10
          done

          echo "::warning::build $id is still $state at itch after three minutes. \
          The upload is not downloadable until itch processes it; this is on their side."
